# cargo-deny policy (PLAN.md section 15.2.7). Run locally with `cargo deny check`.

[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
# Permissive licences only. OFL-1.1 covers the bundled JetBrains Mono font in
# clairlune-render. Add a licence here only after checking it is compatible
# with distributing the app under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "OFL-1.1",
    # ISC is MIT-equivalent; libloading (winit's Linux backends load X11 and
    # Wayland at runtime through it).
    "ISC",
    # Boost: permissive, no attribution needed in binaries. clipboard-win and
    # error-code (copy and paste in the Settings window on Windows, via arboard).
    "BSL-1.0",
    # Public-domain dedication: ksni (the Linux StatusNotifier tray).
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry versions, but allow path-only dev crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

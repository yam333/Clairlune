# Playing guitar by the campfire, notes drifting up.
id = "play_guitar"
weight = 1.0

[requires]
terrain = ["ledge", "flat", "shore", "rooftop"]
time_of_day = ["golden_hour", "dusk", "deep_dusk", "night"]
weather = ["none", "stars", "fireflies", "dust", "shooting_stars"]

[motion]
type = "stationary"

[props.campfire]
attach = "either_side"
effects = ["embers"]

[animation]
start = "strum"

[animation.states.strum]
loop = true
dwell_s = [4, 9]
next = { pause = 1.0 }

[animation.states.pause]
loop = true
dwell_s = [2, 4]
next = { strum = 1.0 }

[[effects]]
type = "particles"
preset = "notes"
at = "item_tip"
states = ["strum"]

[gif]
loop_script = ["strum", "pause"]

[unattended]
props = ["guitar_rest"]

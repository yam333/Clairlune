[package]
name = "clairlune-live"
description = "Clairlune's live wallpaper: plays a scene behind the desktop icons, drawing only what changed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["wallpaper", "live-wallpaper", "desktop", "animation"]
categories = ["graphics", "rendering"]

[dependencies]
clairlune-scene.workspace = true
clairlune-render.workspace = true
clairlune-platform.workspace = true
tracing.workspace = true
wgpu.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true

[target.'cfg(windows)'.dependencies]
softbuffer.workspace = true
windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSGeometry", "NSArray", "NSDictionary", "NSString", "NSValue"] }
objc2-app-kit = { workspace = true, features = ["NSWindow", "NSResponder", "NSView", "NSGraphics", "NSScreen", "objc2-quartz-core"] }
objc2-core-graphics = { workspace = true, features = ["CGWindowLevel", "CGColorSpace", "CGWindow"] }
objc2-core-foundation = { workspace = true, features = ["CFDictionary", "CFNumber", "CFString", "CFData"] }
objc2-io-surface = { workspace = true, features = ["IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation", "libc", "objc2"] }
objc2-quartz-core = { workspace = true, features = ["CALayer", "CATransaction"] }

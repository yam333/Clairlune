[package]
name = "clairlune"
description = "Procedural, animated ASCII-art desktop wallpapers. Local, seeded and deterministic; no AI, no network."
version.workspace = true
edition.workspace = true
# egui 0.37 needs 1.95; the libraries and the CLI keep the workspace minimum.
rust-version = "1.95"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["wallpaper", "ascii-art", "desktop", "procedural", "live-wallpaper"]
categories = ["graphics", "multimedia::images"]

[[bin]]
name = "clairlune"
path = "src/main.rs"

# The app runs on Windows and macOS; build.rs stops a build anywhere else
# (clairlune-cli renders the scenes there).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
clairlune-scene.workspace = true
clairlune-render.workspace = true
clairlune-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["display"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
winit.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true
interprocess.workspace = true
jiff.workspace = true
zip.workspace = true
png.workspace = true
sha2.workspace = true
tray-icon.workspace = true
rfd.workspace = true
clairlune-live.workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]

# Installers (cargo-packager). Build first, then package:
#   cargo build --release -p clairlune && cargo packager --release -p clairlune
# Windows: a per-user setup.exe (no admin rights); macOS: a .app in a DMG.
# CI does both on version tags (.github/workflows/release.yml).
[package.metadata.packager]
product-name = "Clairlune"
identifier = "app.clairlune"
description = "Procedural, animated ASCII-art desktop wallpapers"
publisher = "Clairlune contributors"
category = "Utility"
icons = [
    "packaging/icons/16.png",
    "packaging/icons/32.png",
    "packaging/icons/64.png",
    "packaging/icons/128.png",
    "packaging/icons/256.png",
    "packaging/icons/512.png",
    "packaging/icons/512@2x.png",
]
out-dir = "../../target/packages"
binaries = [{ path = "clairlune", main = true }]
formats = ["nsis", "dmg"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
# The app icon on setup.exe and in the installer's header, not NSIS's own icon.
installer-icon = "packaging/icons/clairlune.ico"

[package.metadata.packager.macos]
minimum-system-version = "13.0"
info-plist-path = "packaging/macos/Info.plist"

[lints]
workspace = true

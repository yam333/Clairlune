name: Dependencies

# Licences and advisories (deny.toml), weekly: new advisories appear without
# any change here. CI checks them on every push too.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0" # Sundays, 04:00 UTC

permissions:
  contents: read

jobs:
  licenses:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

name: Dependencies

# Licences and advisories (deny.toml): when the dependencies change, weekly
# (new advisories appear without any change here), and by hand.
on:
  push:
    branches: [main]
    paths: ["Cargo.lock", "**/Cargo.toml", "deny.toml"]
  pull_request:
    paths: ["Cargo.lock", "**/Cargo.toml", "deny.toml"]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0" # Sundays, 04:00 UTC

permissions:
  contents: read

jobs:
  licenses:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

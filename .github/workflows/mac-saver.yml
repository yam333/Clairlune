name: Mac screen saver

# Builds Clairlune.saver and plays it on a macOS runner the way the screen
# saver host would (scripts/saver_check.swift), with and without a scene from
# the app, and keeps screenshots of each.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["crates/saver/**", "crates/live/src/cg.rs", "scripts/make_saver.sh", "scripts/saver_check.swift", "scripts/ci_pick_saver.py", ".github/workflows/mac-saver.yml"]

permissions:
  contents: read

jobs:
  saver:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mac-saver
      - name: Build the saver
        run: |
          mkdir -p out
          sh scripts/make_saver.sh aarch64-apple-darwin out 0.0.0-check
          ls -la out/Clairlune.saver/Contents/MacOS
      - name: Play it without a scene from the app
        run: swift scripts/saver_check.swift out/Clairlune.saver out/saver-own-scene.png
      - name: Play the app's scene
        run: |
          cargo build --release -p clairlune-cli
          # A scene as the app would hand it over, for this screen.
          read w h <<EOF
          $(swift -e 'import AppKit; let s = NSScreen.main!; print(Int(s.frame.width * s.backingScaleFactor), Int(s.frame.height * s.backingScaleFactor))')
          EOF
          echo "screen ${w}x${h}"
          ./target/release/clairlune-cli generate --seed 21 --activity warm_hands --zoom wide --size "${w}x${h}" --out out/scene.png --recipe-out out/recipe.json
          python3 - "$w" "$h" <<'PY'
          import json, sys
          w, h = int(sys.argv[1]), int(sys.argv[2])
          recipe = json.load(open("out/recipe.json"))
          scene = {"theme": "dark", "buddy": True, "fps": 12, "monitors": [{"width": w, "height": h, "recipe": recipe}]}
          json.dump(scene, open("out/Clairlune.saver/Contents/Resources/screensaver.json", "w"))
          PY
          swift scripts/saver_check.swift out/Clairlune.saver out/saver-app-scene.png
      - name: Play it in the real screen saver host
        # Best effort: macOS 14 and later don't take the module from these
        # defaults (System Settings records the pick in the wallpaper store,
        # which scripts/ci_pick_saver.py writes on this throwaway runner);
        # the host's log and the screenshots say what it played.
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$HOME/Library/Screen Savers"
          rm -rf "$HOME/Library/Screen Savers/Clairlune.saver"
          cp -R out/Clairlune.saver "$HOME/Library/Screen Savers/"
          defaults -currentHost write com.apple.screensaver moduleDict -dict moduleName Clairlune path "$HOME/Library/Screen Savers/Clairlune.saver" type 0
          python3 scripts/ci_pick_saver.py "$HOME/Library/Screen Savers/Clairlune.saver"
          killall WallpaperAgent 2>/dev/null
          sleep 3
          open -a /System/Library/CoreServices/ScreenSaverEngine.app
          sleep 8
          screencapture -x out/host.png
          sleep 2
          screencapture -x out/host-later.png
          cmp -s out/host.png out/host-later.png && echo "host screenshots: the same" || echo "host screenshots: they differ"
          ps -axo pid,rss,%cpu,command | grep -iE "screensaver|legacyScreenSaver" | grep -v grep
          log show --last 2m --style compact --predicate 'process CONTAINS "ScreenSaver" OR process CONTAINS "legacyScreenSaver"' 2>/dev/null | grep -iE "clairlune|error|fail|module" | tail -30
          # Ended like a key press ends it; the host should go too.
          osascript -e 'tell application "System Events" to key code 56' 2>/dev/null
          sleep 4
          ps -axo pid,command | grep -iE "ScreenSaverEngine|legacyScreenSaver" | grep -v grep
          killall ScreenSaverEngine legacyScreenSaver 2>/dev/null
          sleep 2
          ps -axo pid,command | grep -iE "legacyScreenSaver" | grep -v grep && echo "the host is still running after the saver stopped"
          find "$HOME/Library/Containers" -name "Clairlune Saver.log" -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; 2>/dev/null
          find "$HOME/Library/Logs" -name "Clairlune Saver.log" -exec cat {} \; 2>/dev/null
          true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mac-saver
          path: |
            out/*.png
            out/recipe.json

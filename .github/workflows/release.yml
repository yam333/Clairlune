name: Release

# Installers for people who don't use a terminal: a per-user Windows setup.exe
# (plus a portable zip for Scoop) and macOS DMGs (Apple Silicon and Intel).
# Then the package-manager manifests for those files
# (docs/dev/distribution.md), as an artifact: nothing is published to a package
# manager from here yet. Runs on version tags (v1.2.3) and by hand; a tag also
# attaches the installers to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          # The app only: it is signed, then put in a DMG, below.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            formats: app
            arch: aarch64
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            formats: app
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      # The oldest macOS supported (docs/dev/platform-support.md).
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build
        run: cargo build --release -p clairlune --target ${{ matrix.target }}
      - name: Package
        run: cargo packager --release -p clairlune --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      # No Developer ID (docs/dev/distribution.md), so the app is signed ad hoc,
      # which seals its files: an Apple silicon Mac reports a downloaded app
      # without that as damaged, where a signed one gets Open Anyway. Then
      # the DMG: the app and a link to Applications.
      - name: Sign and make the DMG
        if: startsWith(matrix.name, 'macos')
        run: |
          set -euo pipefail
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "clairlune"))')
          app=target/packages/Clairlune.app
          codesign --verify --deep --strict "$app" 2>&1 || echo "as packaged: not sealed"
          xattr -cr "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "^(Identifier|Format|Signature|Sealed Resources)"
          spctl --assess --type execute -vv "$app" 2>&1 || true
          # The DMG: a styled window where the app is dragged onto
          # Applications (scripts/make_dmg.py, dmgbuild in a venv of its own).
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.7
          "$RUNNER_TEMP/dmg/bin/python" scripts/make_dmg.py "$app" "target/packages/Clairlune_${v}_${{ matrix.arch }}.dmg"
          # What a download gets: mounted, the app inside still verifies.
          mnt=$(mktemp -d)
          hdiutil attach "target/packages/Clairlune_${v}_${{ matrix.arch }}.dmg" -mountpoint "$mnt" -nobrowse -readonly
          codesign --verify --deep --strict --verbose=2 "$mnt/Clairlune.app"
          hdiutil detach "$mnt"
      # Scoop installs apps from a zip it unpacks itself.
      - name: Portable zip
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $v = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'clairlune').version
          $dir = New-Item -ItemType Directory -Force target/portable
          Copy-Item target/${{ matrix.target }}/release/clairlune.exe, LICENSE-MIT, LICENSE-APACHE, NOTICE $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "target/packages/clairlune_${v}_x64-portable.zip" -Force
      - uses: actions/upload-artifact@v7
        with:
          name: clairlune-${{ matrix.name }}
          path: |
            target/packages/*.exe
            target/packages/*.zip
            target/packages/*.dmg
          if-no-files-found: error

  manifests:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Write the manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then version=""; fi
          python3 scripts/package_manifests.py --artifacts packages --out manifests --strict ${version:+--version "$version"}
      - uses: actions/upload-artifact@v7
        with:
          name: clairlune-manifests
          path: manifests
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: clairlune-*
          path: packages
          merge-multiple: true
      # The winget manifests as a download of their own, for
      # `winget install --manifest` until the package is in winget's catalog.
      - name: The winget manifests, zipped
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          zip -j "packages/clairlune_${v}_winget.zip" packages/winget/manifests/c/Clairlune/Clairlune/"$v"/*.yaml
      # What install.sh checks its download against.
      - name: Checksums
        working-directory: packages
        run: |
          set -euo pipefail
          sha256sum -- *.exe *.zip *.dmg > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/*.exe
            packages/*.zip
            packages/*.dmg
            packages/SHA256SUMS
          draft: true

name: Publish

# When a release is published (the Release workflow makes it as a draft),
# the package managers get it (docs/distribution.md):
# - the manifests are made from the release's own files (an artifact);
# - with a TAP_TOKEN secret (write access to yam333/homebrew-clairlune), the
#   Homebrew cask and the Scoop manifest are pushed to the tap;
# - with a WINGET_TOKEN secret (a classic token with public_repo), komac
#   opens the winget-pkgs pull request for the new version.
# Without the secrets, publish the artifact's files by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Download the release's installers
        run: gh release download "$TAG" --dir packages --repo "$GITHUB_REPOSITORY"

      - name: Write the manifests
        run: python3 scripts/package_manifests.py --artifacts packages --version "${TAG#v}" --out manifests --strict

      - uses: actions/upload-artifact@v5
        with:
          name: manifests-${{ env.TAG }}
          path: manifests
          include-hidden-files: true

      - name: Homebrew cask and Scoop manifest to the tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/yam333/homebrew-clairlune.git" tap
          mkdir -p tap/Casks tap/bucket
          cp manifests/homebrew/Casks/clairlune.rb tap/Casks/
          cp manifests/scoop/clairlune.json tap/bucket/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Clairlune ${TAG#v}"
          git push

      - name: winget pull request
        if: env.WINGET_TOKEN != ''
        run: |
          cargo install komac --locked
          v="${TAG#v}"
          komac update Clairlune.Clairlune --version "$v" \
            --urls "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/clairlune_${v}_x64-setup.exe" \
            --submit --token "$WINGET_TOKEN"

name: CI

# On a private repository GitHub counts Windows minutes twice and macOS
# minutes ten times against the monthly allowance, so:
# - every push runs the cheap checks on Linux: format, sprite exports,
#   clippy for all three platforms (checked from Linux, nothing linked) and
#   the tests;
# - the full matrix (tests on Windows and macOS, golden hashes in release on
#   every OS) runs weekly when main changed, by hand (Actions > CI > Run
#   workflow), and on pull requests. Run it by hand before a release.
# Pushes that touch only docs or the plan don't run CI at all, and a new
# push cancels the run still going for the previous one.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".planning/**", "docs/**", "LICENSE-*", "NOTICE"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0" # Sundays, 04:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (linux, all targets)
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.full.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The full matrix: by hand, on pull requests, and weekly if main changed.
      - id: full
        run: |
          full=false
          case "${{ github.event_name }}" in
            workflow_dispatch|pull_request) full=true ;;
            schedule)
              if [ -n "$(git log --since='7 days ago' --format=%H -1)" ]; then full=true; fi ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Sprite exports must match their Aseprite sources (no Aseprite needed).
      - name: Sprite exports
        run: python3 scripts/check_sprites.py

      - name: Clippy (Linux)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (Windows)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Clippy (macOS)
        run: cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: Tests (debug)
        run: cargo test --workspace

  full:
    name: test (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is ARM64, so this also checks determinism across CPU architectures.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        if: matrix.os != 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (debug)
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace

      # Same golden hashes in release: catches optimisation-dependent float drift.
      - name: Golden images and determinism (release)
        run: cargo test --release -p clairlune-tests --test golden --test determinism

      - name: Upload mismatching renders
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: golden-actual-${{ matrix.os }}
          path: target/golden-actual/
          if-no-files-found: ignore

      # Shared runners are noisy, so the timing budget is informational here.
      - name: 4K bake timing (informational)
        continue-on-error: true
        run: cargo test --release -p clairlune-tests --test perf -- --ignored --nocapture

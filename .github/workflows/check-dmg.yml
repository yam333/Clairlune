name: "Check: DMG window"

# The DMG window as people see it: the latest release's app, packed by
# scripts/make_dmg.py and marked as downloaded, opened in Finder on a macOS
# runner, with screenshots in light and dark mode. The app inside must still
# verify, and the shortcut must open Privacy & Security, where a blocked
# Clairlune has Open Anyway.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/make_dmg.py", "scripts/dmg_layout.py", "packaging/macos/**", ".github/workflows/check-dmg.yml"]

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  pack:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pack the latest release's app
        run: |
          set -euo pipefail
          v=$(gh release view --repo yam333/Clairlune --json tagName --jq .tagName); v=${v#v}
          gh release download "v$v" --repo yam333/Clairlune --pattern "Clairlune_${v}_aarch64.dmg" --dir rel
          mnt=$(mktemp -d)
          hdiutil attach "rel/Clairlune_${v}_aarch64.dmg" -mountpoint "$mnt" -nobrowse -readonly
          mkdir -p app
          ditto "$mnt/Clairlune.app" app/Clairlune.app
          hdiutil detach "$mnt"
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.7
          mkdir -p out
          "$RUNNER_TEMP/dmg/bin/python" scripts/make_dmg.py app/Clairlune.app out/Clairlune.dmg
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: out/

  # On other machines than the one that packed it.
  open:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dmg
          path: out
      - name: Open it in Finder and take screenshots
        run: |
          set -u
          # As a browser marks it.
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;$(uuidgen)" out/Clairlune.dmg
          # An older Clairlune's DMG is still open, on a disk called Clairlune:
          # its background must not show.
          gh release download v0.29.0 --repo yam333/Clairlune --pattern Clairlune_0.29.0_aarch64.dmg --dir old
          hdiutil attach old/Clairlune_0.29.0_aarch64.dmg
          vol=$(hdiutil attach out/Clairlune.dmg | sed -n 's|.*\(/Volumes/.*\)|\1|p')
          v=$(defaults read "$vol/Clairlune.app/Contents/Info.plist" CFBundleShortVersionString)
          [ "$vol" = "/Volumes/Clairlune $v" ] || { echo "the disk is at $vol"; exit 1; }
          echo "VOL=$vol" >> "$GITHUB_ENV"
          codesign --verify --deep --strict --verbose=2 "$vol/Clairlune.app"
          ls -la "$vol"
          open "$vol"
          sleep 6
          screencapture -x out/dmg-light.png
          defaults write -g AppleInterfaceStyle Dark
          killall Finder; sleep 4
          open "$vol"
          sleep 6
          screencapture -x out/dmg-dark.png
          defaults delete -g AppleInterfaceStyle 2>/dev/null
          killall Finder; sleep 4
      - name: The steps it shows
        run: |
          set +e
          cp -R "$VOL/Clairlune.app" /Applications/
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;$(uuidgen)" /Applications/Clairlune.app
          # open waits for as long as macOS's message is up.
          open /Applications/Clairlune.app & sleep 12
          screencapture -x out/step-2.png
          osascript -e 'tell application "System Events" to tell process "CoreServicesUIAgent" to click button "Done" of window 1'
          sleep 3
          open "$VOL/Privacy & Security" & pid=$!
          sleep 12
          screencapture -x out/step-3.png
          if kill -0 $pid 2>/dev/null; then echo "the shortcut didn't open"; exit 1; fi
          wait $pid || exit 1
          pgrep -x "System Settings" || exit 1
          open "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension?Security"
          sleep 5
          screencapture -x out/step-4.png
          hdiutil detach "$VOL" -force || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dmg-${{ matrix.os }}
          path: out/*.png

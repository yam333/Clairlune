name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        In the app, Settings > General > Report a problem fills most of this in for you.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Open Settings
        2. ...
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Paste from Settings > General > Report a problem > Copy details.
      render: markdown
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.28.0 (Settings > About)"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - macOS, Apple Silicon
        - macOS, Intel
        - Linux (command-line tool)
    validations:
      required: true

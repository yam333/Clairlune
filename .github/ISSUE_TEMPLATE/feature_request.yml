name: Idea
description: Something Clairlune could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like, and what it would be for.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Sketches, screenshots, wallpapers you'd like it to look like.

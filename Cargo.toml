[workspace]
resolver = "3"
members = ["crates/scene", "crates/sprites", "crates/render", "crates/cli", "crates/app", "tests"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Clairlune contributors"]
readme = "README.md"
repository = "https://github.com/yam333/Clairlune"

[workspace.dependencies]
# Our own crates. The version is required so `cargo publish` can resolve them.
clairlune-scene = { path = "crates/scene", version = "0.3.0" }
clairlune-render = { path = "crates/render", version = "0.3.0" }
clairlune-sprites = { path = "crates/sprites", version = "0.3.0" }

# Determinism-critical: pinned exactly. Bumping any of these can change pixels,
# so a bump must re-bless the golden images and bump GENERATOR_VERSION if output changes.
rand_chacha = { version = "=0.10.0", default-features = false }
libm = "=0.2.16"
# Font outlines. (ttf-parser is unmaintained: RUSTSEC-2026-0192.)
skrifa = { version = "=0.50.0", default-features = false, features = ["std"] }

png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
clap = { version = "4.6.8", features = ["derive"] }
proptest = "1.12.0"

[profile.dev]
# Pixel loops are painfully slow at opt-level 0; tests render many images.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"

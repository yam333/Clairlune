[workspace]
resolver = "3"
members = ["crates/scene", "crates/sprites", "crates/render", "crates/platform", "crates/live", "crates/cli", "crates/app", "tests"]

[workspace.package]
version = "0.35.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Clairlune contributors"]
readme = "README.md"
repository = "https://github.com/yam333/Clairlune"

# Lints every crate shares (CI also runs clippy with -D warnings).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# Our own crates. The version is required so `cargo publish` can resolve them.
clairlune-scene = { path = "crates/scene", version = "0.35.0" }
clairlune-render = { path = "crates/render", version = "0.35.0" }
clairlune-sprites = { path = "crates/sprites", version = "0.35.0" }
clairlune-platform = { path = "crates/platform", version = "0.35.0" }
clairlune-live = { path = "crates/live", version = "0.35.0" }

# Determinism-critical: pinned exactly. Bumping any of these can change pixels,
# so a bump must re-bless the golden images and bump GENERATOR_VERSION if output changes.
rand_chacha = { version = "=0.10.0", default-features = false }
libm = "=0.2.16"
# Font outlines. (ttf-parser is unmaintained: RUSTSEC-2026-0192.)
skrifa = { version = "=0.50.0", default-features = false, features = ["std"] }

png = "0.18.1"
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
clap = { version = "4.6.8", features = ["derive"] }
# App shell: one event loop, tray and menu, rolling log files.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
tray-icon = { version = "0.26.1", default-features = false }
# Native folder picker (Settings > Export folder). No GTK: the app is Windows and macOS only.
rfd = { version = "0.18.0", default-features = false }
tracing-appender = "0.2.5"
# Settings UI.
egui = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "wayland", "x11"] }
egui-wgpu = { version = "0.37.0", default-features = false, features = ["winit", "macos-window-resize-jitter-fix"] }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "gles", "wgsl"] }
pollster = "0.4.0"
# Single instance: a second launch asks the running copy to open Settings.
interprocess = "2.4.9"
# Diagnostic bundles (the zip a user attaches to a bug report).
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Timeline: local times, time zones and daylight saving.
jiff = "1.0.1"
# Platform layer: the Win32 wallpaper, DPI and known-folder APIs.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# macOS: AppKit's wallpaper and screen calls, run on the main thread.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSValue", "NSError", "NSNotification", "NSArray", "NSGeometry", "NSObject", "NSOperation", "NSEnumerator", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSScreen", "NSGraphics", "block2", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
block2 = "0.6.2"
# Live wallpapers: window handles for the presenter, and the CPU presenter.
raw-window-handle = "0.6.2"
softbuffer = "0.4.8"
# macOS: process usage and the real home folder.
libc = "0.2.191"
tracing = "0.1.44"
# Checking update downloads against the SHA-256 GitHub lists.
sha2 = { version = "0.10.9", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json", "registry"] }
proptest = "1.12.0"

[profile.dev]
# Pixel loops are painfully slow at opt-level 0; tests render many images.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The GUI stack is the bulk of compile time and no test exercises it: build it
# unoptimised in dev and test builds (release is unaffected).
[profile.dev.package.naga]
opt-level = 0

[profile.dev.package.wgpu]
opt-level = 0

[profile.dev.package.wgpu-core]
opt-level = 0

[profile.dev.package.wgpu-hal]
opt-level = 0

[profile.dev.package.egui]
opt-level = 0

[profile.dev.package.epaint]
opt-level = 0

[profile.dev.package.egui-winit]
opt-level = 0

[profile.dev.package.egui-wgpu]
opt-level = 0

[profile.dev.package.winit]
opt-level = 0

[profile.dev.package.vello_cpu]
opt-level = 0

[profile.dev.package.harfrust]
opt-level = 0

[profile.release]
codegen-units = 1
lto = "thin"
